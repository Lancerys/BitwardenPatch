name: Build Android (Standard + HyperOS)

on:
  workflow_call:
    secrets:
      SIGN_KEYSTORE_BASE64:
        required: true
      GOOGLE_SERVICES_JSON:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - ".github/workflows/build-browser.yml"
  schedule:
    # Every Sunday 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      latest_android_tag: ${{ steps.gen_vars.outputs.latest_android_tag }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Clone upstream Android repo
        run: |
          git clone --depth 1 https://github.com/bitwarden/android.git

      - name: Get latest Android tag
        id: gen_vars
        working-directory: android
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_android_tag="$(git tag --sort=-creatordate | grep 'bwpm' | head -n 1 || true)"

          if [[ -z "${latest_android_tag}" ]]; then
            echo "Failed to find latest Android tag matching 'bwpm'."
            exit 1
          fi

          echo "latest_android_tag=${latest_android_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest_android_tag=${latest_android_tag}"

  build-source:
    name: Build Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, hyperos]

    env:
      LATEST_ANDROID_TAG: ${{ needs.setup.outputs.latest_android_tag }}
      JAVA_VERSION: "21"

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          set -euo pipefail

          test -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" || { echo "SIGN_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "${{ secrets.GOOGLE_SERVICES_JSON }}" || { echo "GOOGLE_SERVICES_JSON is empty"; exit 1; }
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "${{ secrets.KEY_PASSWORD }}" || { echo "KEY_PASSWORD is empty"; exit 1; }

      - name: Clone upstream Android repo
        run: |
          git clone https://github.com/bitwarden/android.git

      - name: Checkout target tag
        working-directory: android
        run: |
          set -euo pipefail

          git fetch --tags --force
          echo "Checking out ${LATEST_ANDROID_TAG}"
          git checkout "${LATEST_ANDROID_TAG}"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Configure JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Ruby
        uses: ruby/setup-ruby@44511735964dcb71245e7e55f72539531f7bc0eb # v1.257.0
        with:
          ruby-version: "3.4.2"
          bundler-cache: false

      - name: Cache Gradle files
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v3-${{ env.JAVA_VERSION }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml', 'android/**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v3-${{ env.JAVA_VERSION }}-
            ${{ runner.os }}-gradle-v3-

      - name: Cache build output
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build-cache
          key: ${{ runner.os }}-build-cache-${{ github.ref_name }}-${{ env.LATEST_ANDROID_TAG }}
          restore-keys: |
            ${{ runner.os }}-build-cache-${{ github.ref_name }}-
            ${{ runner.os }}-build-cache-

      - name: Ensure AGP 9.4 matching NDK for native ELF stripping
        run: |
          set -euo pipefail
          # AGP 9.4 defaults to NDK r28c; GitHub runners do not preinstall this version.
          ndk_version="28.2.13676358"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          llvm_strip="${sdk_root}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [[ ! -x "$llvm_strip" ]]; then
            sdkmanager --install "ndk;${ndk_version}" --channel=0 < /dev/null
          fi
          test -x "$llvm_strip"
          echo "Ready to strip native libraries with NDK ${ndk_version}."
      - name: Install Bundler and dependencies
        working-directory: android
        run: |
          set -euo pipefail

          gem install bundler:2.2.27
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Set version from tag
        working-directory: android
        run: |
          set -euo pipefail

          TAG_NAME="${LATEST_ANDROID_TAG}"

          VERSION_NAME="${TAG_NAME#v}"
          VERSION_NAME="${VERSION_NAME%-bwpm}"
          VERSION_NAME="${VERSION_NAME}-${{ matrix.variant }}"

          # Reserve a higher versionCode range for safe in-place updates.
          # Both APK variants use the SAME value for easy switching.
          VERSION_CODE=$((12000 + GITHUB_RUN_NUMBER))

          echo "Setting Version: ${VERSION_NAME} (${VERSION_CODE})"

          bundle exec fastlane setBuildVersionInfo \
            versionCode:"${VERSION_CODE}" \
            versionName:"${VERSION_NAME}"

      - name: Apply internal patch
        working-directory: android
        run: |
          set -euo pipefail

          test -f ../patches/android/hasPremium.patch || { echo "Patch file not found"; exit 1; }

          cp ../patches/android/hasPremium.patch ./hasPremium.patch
          git apply --check hasPremium.patch
          git apply -v hasPremium.patch

          if [[ "${{ matrix.variant }}" == "hyperos" ]]; then
            test -f ../patches/android/hyperosUnlockFirst.patch
            git apply --check ../patches/android/hyperosUnlockFirst.patch
            git apply --verbose ../patches/android/hyperosUnlockFirst.patch
          fi
          git diff --check

      - name: Prepare signing and Firebase files
        working-directory: android
        run: |
          set -euo pipefail

          mkdir -p ./keystores
          mkdir -p ./app/src/standardRelease

          printf '%s' '${{ secrets.SIGN_KEYSTORE_BASE64 }}' | base64 -d > ./keystores/leamocc.jks
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 -d > ./app/src/standardRelease/google-services.json

          test -s ./keystores/leamocc.jks || { echo "Decoded keystore is empty"; exit 1; }
          test -s ./app/src/standardRelease/google-services.json || { echo "Decoded google-services.json is empty"; exit 1; }

      - name: Generate release Play Store APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bundle exec fastlane assemblePlayStoreReleaseApk \
            storeFile:leamocc.jks \
            storePassword:"${KEYSTORE_PASSWORD}" \
            keyAlias:key0 \
            keyPassword:"${KEY_PASSWORD}"

      - name: Verify Bitwarden SDK symbols stripped from release APK
        working-directory: android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from glob import glob
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess, tempfile
          apks=glob("app/build/outputs/apk/standard/release/*.apk")
          assert len(apks) == 1, apks
          with ZipFile(apks[0]) as archive:
              lib=archive.read("lib/arm64-v8a/libbitwarden_uniffi.so")
          with tempfile.TemporaryDirectory() as tmp:
              so=Path(tmp)/"libbitwarden_uniffi.so"
              so.write_bytes(lib)
              elf=subprocess.run(["readelf","-SW",str(so)],capture_output=True,text=True,check=True)
          assert ".symtab" not in elf.stdout and ".strtab" not in elf.stdout, "AGP failed to strip native ELF symbol tables"
          print(f"Stripped ARM64 library verified: {len(lib)/1048576:.2f} MiB")
          PY
      - name: Verify APK output
        working-directory: android
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(app/build/outputs/apk/standard/release/*.apk)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No APK found in app/build/outputs/apk/standard/release/"
            exit 1
          fi

          printf 'Generated APK(s):\n'
          printf '%s\n' "${files[@]}"

      - name: Stage named variant APK
        working-directory: android
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/standard/release/*.apk)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one Android APK, got ${#files[@]}."
            exit 1
          fi
          mkdir -p ../dist
          cp "${files[0]}" "../dist/Bitwarden-${LATEST_ANDROID_TAG}-${{ matrix.variant }}.apk"
          ls -lh ../dist/*.apk
          sha256sum ../dist/*.apk

      - name: Upload variant APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: bitwarden-android-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish both Android variants
    runs-on: ubuntu-24.04
    needs: [setup, build-source]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LATEST_ANDROID_TAG: ${{ needs.setup.outputs.latest_android_tag }}
    steps:
      - name: Download both APK artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bitwarden-android-*
          merge-multiple: true
          path: artifacts

      - name: Verify both variants before publishing
        run: |
          set -euo pipefail
          test -s "artifacts/Bitwarden-${LATEST_ANDROID_TAG}-standard.apk"
          test -s "artifacts/Bitwarden-${LATEST_ANDROID_TAG}-hyperos.apk"
          ls -lh artifacts/*.apk
          sha256sum artifacts/*.apk

      - name: Upload both variants to one GitHub Release
        run: |
          set -euo pipefail
          tag="${LATEST_ANDROID_TAG}"
          standard="artifacts/Bitwarden-${tag}-standard.apk"
          hyperos="artifacts/Bitwarden-${tag}-hyperos.apk"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "$tag [Original Changelog](https://github.com/bitwarden/android/releases/tag/$tag)"
          fi
          gh release upload "$tag" "$standard" "$hyperos" --repo "$GITHUB_REPOSITORY" --clobber
          # Only retire the legacy APK AFTER both replacements were published.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "com.x8bit.bitwarden.apk"; then
            gh release delete-asset "$tag" "com.x8bit.bitwarden.apk" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'

