name: Original Premium + HyperOS A (Official Version Login Test)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hyperos-unlock-first
    paths:
      - .github/workflows/build-original-premium-login-test.yml
      - patches/android/hasPremium.patch
      - patches/android/hyperosUnlockFirst.patch

permissions:
  contents: read
  actions: read

concurrency:
  group: original-premium-hyperos-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_TAG: v2026.10.0-bwpm
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Clone pinned Bitwarden source
        run: |
          set -euo pipefail
          git clone https://github.com/bitwarden/android.git
          cd android
          git fetch --tags --force
          git checkout "${UPSTREAM_TAG}"
          echo "Upstream revision: $(git rev-parse HEAD)"

      - name: Apply BOTH original Premium and HyperOS A patches without modifying either
        working-directory: android
        run: |
          set -euo pipefail
          git apply --check ../patches/android/hasPremium.patch
          git apply --verbose ../patches/android/hasPremium.patch
          git apply --check ../patches/android/hyperosUnlockFirst.patch
          git apply --verbose ../patches/android/hyperosUnlockFirst.patch
          git diff --check
          echo 'Applied original hasPremium.patch and original hyperosUnlockFirst.patch without editing either patch.'
          git diff --name-only

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'
          bundler-cache: false

      - name: Ensure AGP 9.4 default NDK is available for ELF stripping
        run: |
          set -euo pipefail
          ndk_version="28.2.13676358"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          llvm_strip="${sdk_root}/ndk/${ndk_version}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [[ ! -x "$llvm_strip" ]]; then
            sdk_manager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdk_manager" ]]; then
              sdk_manager="$(find "${sdk_root}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
            fi
            test -x "$sdk_manager"
            "$sdk_manager" --install "ndk;${ndk_version}" --channel=0 < /dev/null
          fi
          test -x "$llvm_strip"
          echo "Selected Android NDK ${ndk_version}: $llvm_strip"
      - name: Install Bundler dependencies
        working-directory: android
        run: |
          set -euo pipefail
          gem install bundler:2.2.27
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Choose fixed low versionCode below formal Android releases
        id: installed_compatible_code
        run: |
          set -euo pipefail
          # Clean login: 10000; TOTP-only A: 10001; currently published Standard/HyperOS: 12045.
          # Installation order: 10000 -> 10001 -> 10002 -> 12045.
          # versionName must be the OFFICIAL unmodified value for authentication.
          echo 'version_code=10002' >> "$GITHUB_OUTPUT"
          echo 'Original Premium + HyperOS A test versionCode=10002; official versionName=2026.10.0'
      - name: Set EXACT official versionName (no suffix)
        working-directory: android
        env:
          EXPERIMENT_VERSION_CODE: ${{ steps.installed_compatible_code.outputs.version_code }}
        run: |
          set -euo pipefail
          bundle exec fastlane setBuildVersionInfo \
            versionCode:"${EXPERIMENT_VERSION_CODE}" \
            versionName:"2026.10.0"

      - name: Validate signing and Firebase secrets
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGN_KEYSTORE_BASE64"
          test -n "$GOOGLE_SERVICES_JSON"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          mkdir -p android/keystores android/app/src/standardRelease
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 -d > android/keystores/leamocc.jks
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/src/standardRelease/google-services.json
          test -s android/keystores/leamocc.jks
          test -s android/app/src/standardRelease/google-services.json

      - name: Assemble signed experiment APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle exec fastlane assemblePlayStoreReleaseApk \
            storeFile:leamocc.jks \
            storePassword:"${KEYSTORE_PASSWORD}" \
            keyAlias:key0 \
            keyPassword:"${KEY_PASSWORD}"

      - name: Verify release APK contains stripped Bitwarden SDK native library
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from glob import glob
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess, tempfile
          paths=glob("android/app/build/outputs/apk/standard/release/*.apk")
          assert len(paths) == 1, paths
          with ZipFile(paths[0]) as package:
              binary=package.read("lib/arm64-v8a/libbitwarden_uniffi.so")
          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)/"libbitwarden_uniffi.so"
              target.write_bytes(binary)
              result=subprocess.run(["readelf","-SW",str(target)],capture_output=True,text=True,check=True)
          assert ".symtab" not in result.stdout and ".strtab" not in result.stdout, "ELF symbol tables were NOT stripped"
          print(f"Verified stripped ARM64 library: {len(binary)/1048576:.2f} MiB")
          PY
      - name: Stage uniquely named build output
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(android/app/build/outputs/apk/standard/release/*.apk)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one APK, got ${#files[@]}"; exit 1
          fi
          mkdir -p dist
          cp "${files[0]}" dist/Bitwarden-2026.10.0-originalPremium-HyperOS-A-vc10002.apk
          ls -lh dist/*.apk
          sha256sum dist/*.apk

      - name: Upload experiment APK only (no Release)
        uses: actions/upload-artifact@v6
        with:
          name: bitwarden-original-premium-hyperos-A-official-version
          path: dist/Bitwarden-2026.10.0-originalPremium-HyperOS-A-vc10002.apk
          if-no-files-found: error
          retention-days: 14
