name: One-time HyperOS B Branch Retirement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-hyperos-b.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-obsolete-b:
    runs-on: ubuntu-22.04
    steps:
      - name: Delete only the retired B experiment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="heads/experiment/hyperos-passkey"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
            echo "Retired branch experiment/hyperos-passkey deleted."
          else
            echo "Retired B branch already absent."
          fi
