name: APK Size Regression Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apk-size-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-2026-9-versions:
    name: Diagnose large 2026.9.1 APK
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download historical APKs from Releases
        run: |
          set -euo pipefail
          mkdir -p older newer
          gh release download v2026.9.0-bwpm --repo "$GITHUB_REPOSITORY" \
            --pattern "com.x8bit.bitwarden.apk" --dir older
          gh release download v2026.9.1-bwpm --repo "$GITHUB_REPOSITORY" \
            --pattern "com.x8bit.bitwarden.apk" --dir newer
          test -s older/com.x8bit.bitwarden.apk
          test -s newer/com.x8bit.bitwarden.apk
          ls -lh older/*.apk newer/*.apk
      - name: Compare compressed ZIP entries and native ABIs
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from zipfile import ZipFile
          filenames = {
              "old": "older/com.x8bit.bitwarden.apk",
              "new": "newer/com.x8bit.bitwarden.apk",
          }
          entries = {}
          for name, path in filenames.items():
              with ZipFile(path) as archive:
                  entries[name] = {
                      info.filename: info.compress_size
                      for info in archive.infolist() if not info.is_dir()
                  }
          old, new = entries["old"], entries["new"]
          def group(path):
              if path.startswith("lib/"):
                  parts = path.split("/")
                  return "Native libraries / " + (parts[1] if len(parts)>1 else "unknown")
              if path.startswith("assets/"): return "Assets"
              if path.startswith("res/"): return "Android resources"
              if path.endswith(".dex"): return "DEX code"
              return "Other files"
          def mb(v): return f"{v/1048576:.2f} MiB"
          old_groups, new_groups = defaultdict(int), defaultdict(int)
          for key, value in old.items(): old_groups[group(key)] += value
          for key, value in new.items(): new_groups[group(key)] += value
          lines = ["# APK size growth: v2026.9.0 -> v2026.9.1", ""]
          lines += [f"Old: {mb(Path(filenames['old']).stat().st_size)}",
                    f"New: {mb(Path(filenames['new']).stat().st_size)}", ""]
          lines += ["## Compressed bytes by category", ""]
          for name in sorted(set(old_groups) | set(new_groups),
                             key=lambda n: new_groups[n]-old_groups[n], reverse=True):
              lines.append(f"- {name}: {mb(old_groups[name])} -> {mb(new_groups[name])}; "
                           f"delta {(new_groups[name]-old_groups[name])/1048576:+.2f} MiB")
          lines += ["", "## Top 40 APK entries by compressed size increase", ""]
          for name in sorted(set(old) | set(new),
                             key=lambda n: new.get(n,0)-old.get(n,0), reverse=True)[:40]:
              lines.append(f"- {name}: {mb(old.get(name,0))} -> {mb(new.get(name,0))}; "
                           f"delta {(new.get(name,0)-old.get(name,0))/1048576:+.2f} MiB")
          txt = "\n".join(lines) + "\n"
          print(txt)
          Path("apk-size-audit.md").write_text(txt, encoding="utf-8")
          PY
      - name: Upload size-audit report
        uses: actions/upload-artifact@v6
        with:
          name: apk-size-audit-report
          path: apk-size-audit.md
          if-no-files-found: error
